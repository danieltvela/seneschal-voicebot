  <title
     id="title1">Seneschal icon — the white banner of the Steward of Gondor</title>
  <desc
     id="desc1">A plain white standard on a hanging bar, swallowtail lower edge, no house emblem — the sigil of the Steward of Gondor. Designed for an AI voice assistant that serves the user as its king.</desc>
  <!--
    Icon only. The banner is drawn as `currentColor` so it adapts to any
    background (light or dark). For a faithful "white banner" on dark UIs,
    set the SVG `color` to #FFFFFF. For dark-on-light, set it to #0B1220.
  -->
