  <title
     id="title1">Seneschal icon — the white banner of the Steward of Gondor</title>
  <desc
     id="desc1">A plain white standard on a hanging bar, swallowtail lower edge, with a silver inner border and three silver stars (STT, TTS, LLM). Designed for an AI voice assistant that serves the user as its king.</desc>
  <rect
     style="fill:#000000;fill-opacity:1;stroke-width:0"
     id="rect2"
     width="127.38461"
     height="127.69231"
     x="0.61538464"
     y="0.30769232"
     inkscape:label="background" />
  <g
     id="g1"
     style="fill:#ffffff;fill-opacity:1"
     inkscape:label="banner">
    <!-- Banner hanging bar -->
    <rect
       x="30"
       y="9.6923075"
       width="68"
       height="4"
       rx="2"
       id="rect1"
       style="fill:#ffffff;fill-opacity:1" />
    <!-- Plain white standard with swallowtail -->
    <path
       d="M 34,16.923077 H 94 V 119.07692 L 64,101.04977 34,119.07692 Z"
       id="path1"
       style="fill:#ffffff;fill-opacity:1" />
    <!-- Inner border (silver) -->
    <path
       d="M 38,20.92 H 90 V 112.01 L 64,96.38 38,112.01 Z"
       id="inner-border"
       style="fill:none;stroke:#A8A296;stroke-width:1.5;stroke-linejoin:miter;stroke-opacity:1"
       inkscape:label="inner border" />
  </g>
