     d="m 46.769229,42.461539 -3.09828,-1.660909 -3.12468,1.610694 0.622197,-3.459889 -2.49744,-2.474014 3.482819,-0.47742 1.581176,-3.13972 1.530304,3.164827 3.474662,0.533561 -2.53704,2.433391 z"
     transform="translate(3.3846154,21.730769) translate(43.692307,38.153847) scale(1.2) translate(-43.692307,-38.153847)"
     inkscape:label="star-stt" />
  <path
