  # ── Build macOS ────────────────────────────────────────────────────────────
  build-macos:
    name: Build · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (avspeech)
        run: cargo build --release --bin seneschal --features avspeech

  # ── Desktop checks and unsigned bundle smoke ───────────────────────────────
  desktop-check:
    name: Desktop · Check + Bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils libfuse2 file desktop-file-utils \
            libasound2-dev espeak-ng pkg-config build-essential cmake \
            libssl-dev libclang-dev libgomp1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Frontend checks
        run: |
          npm run check
          npm test
          npm run build
        working-directory: desktop

      # Tauri's build script validates the Linux resource list, so stage the
      # sidecar/espeak data before cargo test or clippy on a clean checkout.
      - name: Build sidecar
        env:
          CARGO_TARGET_DIR: /tmp/seneschal-target
        run: npm run sidecar:build
        working-directory: desktop

      - name: Rust checks
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --no-deps -- -D warnings
        working-directory: desktop

      - name: Build unsigned bundles
        run: npm run tauri build
        working-directory: desktop

      - name: Verify bundles
        run: bash scripts/verify-bundle.sh
        working-directory: desktop

