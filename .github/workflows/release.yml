name: Release

# Trigger: push a version tag like v0.1.0-alpha.10 or v1.0.0
on:
  push:
    tags:
      - 'v[0-9]*.*.*'

permissions:
  contents: write

# Serialize releases so updater manifests and the preview feed are not raced.
concurrency:
  group: seneschal-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Version guard ─────────────────────────────────────────────────────────
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check manifest versions against tag
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

  # ── Draft release ─────────────────────────────────────────────────────────
  prepare-release:
    name: Prepare release
    needs: [check-version]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft=true
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          else
            ARGS=(--draft --title "Seneschal ${TAG}" --notes "Release ${TAG}.")
            if [[ "${PRERELEASE}" = "true" ]]; then
              ARGS+=(--prerelease)
            fi
            gh release create "${TAG}" "${ARGS[@]}"
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # ── CLI daemon — Apple Silicon ────────────────────────────────────────────
  # x86_64-apple-darwin is not built for the CLI: ONNX Runtime (>= 1.24) and
  # ort-sys no longer publish binaries for Intel macOS, so `parakeet` cannot
  # build for that target. The desktop app does not enable `parakeet`.
  build-cli-macos:
    name: CLI · ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin seneschal --target ${{ matrix.target }} --features speech,avspeech,tui,parakeet

      - name: Package
        run: |
          BIN="target/${{ matrix.target }}/release/seneschal"
          strip "$BIN"
          tar -czf "voicebot-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" seneschal
          shasum -a 256 "voicebot-${{ matrix.target }}.tar.gz" > "voicebot-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: voicebot-${{ matrix.target }}
          path: voicebot-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # ── CLI daemon — Linux x86_64 ─────────────────────────────────────────────
  build-cli-linux:
    name: CLI · x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-C link-arg=-lgomp"
      CARGO_TARGET_DIR: /tmp/seneschal-target
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev espeak-ng pkg-config build-essential cmake \
            libssl-dev libclang-dev libgomp1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-linux

      - name: Build
        run: cargo build --release --locked --bin seneschal --features kokoro

      - name: Package
        run: |
          BIN="${CARGO_TARGET_DIR}/release/seneschal"
          strip "$BIN"
          tar -czf "voicebot-x86_64-unknown-linux-gnu.tar.gz" -C "${CARGO_TARGET_DIR}/release" seneschal
          sha256sum "voicebot-x86_64-unknown-linux-gnu.tar.gz" > "voicebot-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: voicebot-x86_64-unknown-linux-gnu
          path: voicebot-x86_64-unknown-linux-gnu.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # ── Desktop app — signed bundles and updater artifacts ────────────────────
  build-desktop:
    name: Desktop · ${{ matrix.target }}
    needs: [prepare-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Serialize updater-manifest writes to the same draft release.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils libfuse2 file desktop-file-utils \
            libasound2-dev espeak-ng pkg-config build-essential cmake \
            libssl-dev libclang-dev libgomp1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Import Apple signing certificate
        if: startsWith(matrix.target, 'aarch64-apple') || startsWith(matrix.target, 'x86_64-apple')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "${APPLE_CERTIFICATE}" | base64 --decode > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build sidecar
        env:
          CARGO_TARGET_DIR: /tmp/seneschal-target
        run: npm run sidecar:build -- ${{ matrix.target }}
        working-directory: desktop

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Seneschal ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Verify bundles
        env:
          SENESCHAL_BUNDLE_TARGET: ${{ matrix.target }}
          REQUIRE_UPDATER_ARTIFACTS: '1'
        run: bash scripts/verify-bundle.sh
        working-directory: desktop

  # ── Publish and updater feeds ─────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [prepare-release, build-cli-macos, build-cli-linux, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload CLI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "${TAG}" \
            artifacts/voicebot-*.tar.gz \
            artifacts/voicebot-*.tar.gz.sha256 \
            install.sh --clobber

      - name: Verify desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REQUIRED=(
            '*.dmg'
            '*.deb'
            '*.AppImage'
            '*.app.tar.gz'
            '*.AppImage.sig'
            '*.app.tar.gz.sig'
            '*.deb.sig'
            'latest.json'
          )
          ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          echo "${ASSETS}"
          for pattern in "${REQUIRED[@]}"; do
            grep -q -- "${pattern}" <<<"${ASSETS}" ||
              { echo "missing release asset matching ${pattern}"; exit 1; }
          done

          gh release download "${TAG}" --pattern 'latest.json' --output latest.json --clobber
          node scripts/verify-updater-manifest.mjs latest.json "${TAG}"

      - name: Build release notes
        run: |
          TAG="${{ github.ref_name }}"
          {
            echo "## Desktop app"
            echo ""
            echo "- macOS: download and open the DMG for your architecture."
            echo "- Linux: download the AppImage, make it executable, and run it; a Debian package is also provided."
            echo ""
            echo "## CLI"
            echo ""
            echo '```sh'
            echo "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh"
            echo '```'
            echo ""
            echo "Pin a specific version:"
            echo '```sh'
            echo "SENECHAL_VERSION=${TAG} \\"
            echo "  curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh"
            echo '```'
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE="${{ needs.prepare-release.outputs.prerelease }}"
          ARGS=(--draft=false --title "Seneschal ${TAG}" --notes-file release-notes.md)
          if [[ "${PRERELEASE}" = "true" ]]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release edit "${TAG}" "${ARGS[@]}"

      - name: Update preview updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FEED="desktop-updates-preview"
          if gh release view "${FEED}" >/dev/null 2>&1; then
            gh release upload "${FEED}" latest.json --clobber
            gh release edit "${FEED}" --draft=false --prerelease
          else
            gh release create "${FEED}" latest.json \
              --target "${GITHUB_SHA}" \
              --title "Desktop updater preview feed" \
              --notes "Technical release carrying the latest desktop updater manifest for alpha, beta and rc builds." \
              --prerelease
          fi
