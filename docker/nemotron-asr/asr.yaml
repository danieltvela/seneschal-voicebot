# nemo-speech ASR-only server — Plan A: servicio de STT INDEPENDIENTE.
#
# Sirve únicamente NVIDIA Nemotron 3.5 ASR Streaming 0.6B (greedy RNNT,
# multilingüe). El TTS (Magpie) vive en su propio servicio magpie-tts (:8025).
#
# Se carga con:
#   nemo-speech serve --config /etc/nemo-speech/asr.yaml
#
# Montaje esperado (ver docker-compose.yml, servicio `nemotron-asr`):
#   /models/asr/asr.gguf                (pesos ASR, ro) -> download-weights.sh
#   /models/asr/silero-v6.2.0.gguf      (VAD del proveedor, ro)
#
# Precedencia de ajustes: defaults < este YAML < NEMO_SPEECH_* < --flags.
http:
  host: 0.0.0.0
  port: 8080
  threads: 4
  max-upload-mb: 512

asr:
  enabled: true
  backend:
    gpu: 0                 # índice DENTRO del contenedor (host GPU 0, devices ["0"])
  model:
    path: /models/asr/asr.gguf
    name: nemotron-3.5     # id que anuncia GET /v1/models (= STT_MODEL en Seneschal)
  streaming:
    # Chunk del modelo cache-aware RNNT. rnnt_right_context=1 => 160 ms.
    # NO usar streaming.chunk_size aquí: es la ventana CTC, no RNNT.
    # Equivalencias: 0=80ms, 1=160ms, 3=320ms, 6=560ms, 13=1120ms.
    rnnt_right_context: 1
  # VAD del proveedor y endpointing activados: el cierre de turno ocurre en el
  # servidor, no en el segmentador local de Seneschal.
  vad:
    model_path: /models/asr/silero-v6.2.0.gguf
    masker:
      mask_enable: false   # el VAD solo gobierna el endpointing
      onset: 0.65          # equivalentes a los umbrales previos de Seneschal
      offset: 0.45
  endpointing:
    enable: true
    vad_based: true
    # `session.update` envía VAD_SILENCE_MS por sesión; este es el fallback.
    stop_history_eou_ms: 300
  decoder:
    kind: greedy

# Puntuación y capitalización: nativas en Nemotron 3.5. El cliente realtime
# envía `automatic_punctuation: true`; no se necesita un modelo PnC externo.
#
# TTS deshabilitado en este servicio: lo sirve magpie-tts (:8025).
tts:
  enabled: false
