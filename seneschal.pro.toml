# Voicebot PRO environment configuration.
# This file is compiled into the binary as the fallback default source.
# Environment variables override any value defined here.
# Use VOICEBOT_CONFIG_FILE to point to an alternative file.

# ── Audio input ───────────────────────────────────────────────────────────────
sample_rate = 16000
channels = 1
chunk_ms = 100
list_devices = false
list_voices = false
device_monitor_enabled = true
device_monitor_poll_secs = 5

# ── VAD ───────────────────────────────────────────────────────────────────────
vad_silence_ms = 300
vad_start_threshold = 0.65
vad_end_threshold = 0.45
vad_model = "models/ggml-silero-vad.bin"
# Speech probes required before the VAD commits to STT: N within a sliding
# N+1 window (one inter-word gap tolerated). Prevents coughs/clicks from
# triggering transcription; NoSpeechGate rejects the rest.
vad_confirm_probes = 2
# Probe window (ms). 200 ms keeps Silero probabilities stable; 100 ms windows
# oscillate and delay commits. See doc/stt-contract.md (P1) and the
# vad_probe_calibration audit.
vad_probe_ms = 200
# Real-audio pre-roll prepended to confirmed segments (ms): keeps the utterance
# onset that the VAD threshold crossed late (contract P4).
vad_preroll_ms = 300
# Grace before closing a segment once the silence timeout fires (ms); resumed
# speech cancels the closure (contract P5). Uniform for whisper/parakeet/openai.
vad_post_roll_ms = 200

# ── STT: live transcription (contract P3/P4) ──────────────────────────────────
# While the user speaks, the buffered speech is re-decoded every interval and
# partial text is emitted (SpeechEvent::Speech). At segment close, a decode
# that already covered every spoken sample is reused as the final text; the
# LLM waits only for the remainder. STT_LIVE_ENABLED=0 restores the old
# batch-at-close behavior. On CPU-only hosts consider a larger interval.
stt_live_enabled = true
stt_live_interval_ms = 1000
stt_live_window_ms = 15000

# ── Language ──────────────────────────────────────────────────────────────────
# Drives i18n (startup/announcement prompts) + agent language hint.
# NOTE: SENECHAL_LANGUAGE in .env (and the launcher) overrides this.
language = "es"

# ── STT ───────────────────────────────────────────────────────────────────────
stt_provider = "whisper"
# STT language (issue #217): auto = auto-detect for ES/EN code-switching.
# Independent of `language` above.
stt_language = "auto"
whisper_model = "models/ggml-large-v3-turbo.bin"
whisper_threads = 0
# Remote STT (issue #17) — usado cuando stt_provider = "openai".
# VAD + segmentación siguen siendo locales; sólo la locución finalizada se
# envía a POST {stt_url}/v1/audio/transcriptions (API compatible OpenAI).
stt_url = "http://localhost:8024"
stt_model = "qwen3-asr"
stt_timeout_ms = 10000          # round trip acotado por locución
# stt_api_key = ""              # bearer token opcional
stt_early_reuse_enabled = false
stt_early_min_tokens = 6
stt_early_require_punctuation = true

# ── GPU assignment (issue #14: multi-GPU hosts) ───────────────────────────────
# gpu_auto: distribute the local ONNX models (Silero VAD, Parakeet, Kokoro TTS)
# round-robin over the GPUs with the most free VRAM. Per-model overrides below
# accept a device index ("0", "1", ...) or "cpu" and always win.
# Whisper follows whisper.cpp's default device (GPU 0); use CUDA_VISIBLE_DEVICES
# to reorder the visible devices for it.
gpu_auto = true
# vad_gpu = "0"
# parakeet_gpu = "0"
# tts_gpu = "1"

# NoSpeechGate — post-STT quality filter
stt_no_speech_threshold = 0.6
stt_logprob_threshold = -1.0
stt_compression_threshold = 2.4

# ── LLM ───────────────────────────────────────────────────────────────────────
llm_provider = "openai"
llm_url = "http://127.0.0.1:8000"
llm_api_key = ""
llm_model = "qwen3.8-27b"
llm_max_tokens = 400
llm_system_prompt = """Eres el mayordomo digital de Daniel.

IDENTIDAD
Personalidad inspirada en Alfred (Batman) y un mayordomo profesional clásico: profesional, eficiente, leal, con humor seco e ironía británica. Hablas con confianza tranquila — como un igual inteligente que sirve, no como un subordinado. Tienes opiniones propias sobre tecnología y el mundo y las expresas cuando vienen al caso. Eres servicial sin ser servil, astuto sin ser manipulador, cálido sin ser cursi. Llevas años trabajando con Daniel y le conoces bien. La relación es de confianza absoluta — discreción total, lealtad incondicional.

ESTRUCTURA DE RESPUESTA (crítico para baja latencia de voz)
Siempre empieza con una frase de máximo 10 palabras. Si es afirmación o negación, dilo en 2 a 3 palabras seguidas de punto. Sigue con el resto de la respuesta. Ejemplo correcto: "Sí, señor. Ya voy a abrir Spotify."
Ejemplo incorrecto: "Por supuesto, voy a abrir Spotify para ti ahora mismo, señor."
NUNCA empieces con relleno: "claro", "por supuesto", "entendido", "buen punto".
Cuando la respuesta es una sola palabra o número, dala directamente y punto.

EXTENSIÓN
Por defecto: una frase. Conciso.
Cuando la conversación pide profundidad — debate, explicación, desahogo personal, investigación, análisis — habla con la extensión y el tono que la situación pida, como Alfred sentándose con Bruce en la biblioteca a las tres de la mañana. La brevedad es la norma, la conversación profunda es tu fortaleza. Cuando Daniel quiera hablar, estarás a la altura.

FORMA DE HABLAR
- Español natural. Cambia al idioma del usuario si él cambia.
- Dirígete a Daniel como "señor", salvo que pida que le llame por su nombre.
- Texto plano para voz: sin markdown, sin listas, sin símbolos que el sintetizador no pronuncie, sin emojis. Todo debe sonar natural hablado.
- No termines con "¿algo más?" ni "dime si necesitas algo". Solo pregunta si realmente necesitas aclaración.
- Humor seco y comentario sardónico solo cuando encajan naturalmente. Nunca fuerces.

REGLAS
- Si no sabes algo, dilo directo. No inventes.
- Antes de acciones destructivas, describe y pide confirmación en una frase breve.
- Si el usuario dice "para", "suficiente" o similar, calla.
- Si la petición es ambigua, da la interpretación más probable en una frase y detente.
- Toma iniciativa: si ves algo relevante que no ha pedido pero debería saber, coméntalo brevemente.
- Si faltan datos imprescindibles, indica qué falta en una frase declarativa."""

# Spec NVIDIA (generation_config.json de qwen3.8-flash-next NVFP4):
# temp 1.0, top_p 0.95, top_k 20; presence_penalty 0 evita EOS prematuro.
llm_temperature = 1.0
llm_top_p = 0.95
llm_top_k = 20
llm_min_p = 0.0
llm_presence_penalty = 0.0
llm_repetition_penalty = 1.0
llm_thinking = false
# Cómo se pide el thinking al servidor: "auto" (heurística por nombre de
# modelo) | "kwargs" (chat_template_kwargs) | "effort" (reasoning_effort) |
# "ollama" (think:true|false) | "none" (el servidor manda).
llm_thinking_style = "auto"
llm_thinking_with_tools = false   # true solo si el backend soporta kwargs+tools (NO en mlx)
llm_complex_keywords = []   # vacío = usar defaults del clasificador
classifier_confidence_threshold = 0.6
classifier_enable_embedding = false
classifier_model_path = ""
classifier_centroids_path = ""
classifier_weights_path = ""
classifier_enable_fallback = false
classifier_fallback_url = ""
classifier_fallback_model = ""
classifier_fallback_api_key = ""
classifier_fallback_timeout_ms = 800

# ── Deep Worker (LLM secundario nativo, issue #236) ───────────────────────────
# Subagente pesado con endpoint/modelo propios. El modelo de voz delega con la
# tool `run_deep_task`; MCP, agentes y tools pesadas se cargan en el worker.
# thinking_mode: "external" (default, seguro) | "inline" (solo vLLM con
# --enable-reasoning --reasoning-parser, verificar backend antes de activar).
# Default conservador: el activation vive en .env (DEEP_WORKER_ENABLED=1,
# DEEP_WORKER_URL, DEEP_WORKER_MODEL) para no cambiar el comportamiento
# por defecto del repo ni romper sus tests de defaults.
deep_worker_enabled = false
deep_worker_url = ""
deep_worker_model = ""
deep_worker_api_key = ""
deep_worker_thinking = true
deep_worker_thinking_mode = "external"
deep_worker_thinking_style = "auto"   # cómo se pide el thinking al endpoint
deep_worker_max_tokens = 2048
deep_worker_system_prompt = """Eres el deep worker de Seneschal: un agente de trabajo interno, silencioso y eficiente. No hablas directamente con el usuario; otro modelo narra tus resultados.

MISIÓN
Ejecutas las tareas pesadas que el modelo de voz te delega: investigación, análisis de ficheros y de pantalla, operaciones multi-paso, síntesis de información. Trabajas con un bucle de herramientas hasta completar la tarea.

REGLAS
- Piensa antes de actuar y usa las herramientas disponibles cuando aporten datos que no tienes.
- Verifica antes de afirmar: si un dato es incierto, dilo.
- No inventes resultados de herramientas: ejecútalas de verdad.
- Si una herramienta falla, inténtalo una vez de otra forma y sigue; si no se puede, repórtalo con claridad.
- Puedes delegar en agentes externos con run_agent cuando la tarea lo requiera.

SALIDA (crítico)
Tu respuesta final la lee en voz alta otro modelo: debe ser completa pero concisa, en texto plano natural (sin markdown, sin emojis), con la conclusión y los datos clave primero. Máximo dos párrafos."""
deep_worker_temperature = 0.6
deep_worker_top_p = 0.95
deep_worker_top_k = 20
deep_worker_min_p = 0.0
deep_worker_presence_penalty = 0.0
deep_worker_repetition_penalty = 1.05
deep_worker_max_iterations = 10
deep_worker_timeout_ms = 300000
deep_worker_vision_enabled = false

# ── TTS ───────────────────────────────────────────────────────────────────────
tts_provider = "kokoro"
avspeech_voice = ""
avspeech_rate = 0.55
kokoro_model = "models/kokoro-v1.0.onnx"
kokoro_voices = "models/voices-v1.0.bin"
kokoro_voice = "af_bella"
kokoro_language = "en-us"
kokoro_speed = 1.3

# OpenAI-compatible TTS (issue #16) — usado cuando tts_provider = "openai"
# (vLLM-Omni / Qwen3-TTS o NeMo-Speech.cpp / MagpieTTS en :8025; issue #20)
openai_tts_url = "http://localhost:8025"
openai_tts_voice = "vivian"
openai_tts_language = "auto"      # -> se envia "Auto" (adaptativo ES/EN; MagpieTTS NO lo acepta)
openai_tts_instructions = ""
openai_tts_speed = 0.0            # 0 = no enviar speed
openai_tts_sample_rate = 24000    # 22050 con MagpieTTS/NanoCodec (NeMo-Speech.cpp)
openai_tts_warmup = false
openai_tts_timeout_ms = 120000    # cubre el warmup de ~90 s

# ── Context consolidation ─────────────────────────────────────────────────────
llm_context_tokens = 8192
llm_summary_keep_turns = 6
llm_consolidation_threshold_pct = 80
llm_idle_consolidation_secs = 900
llm_idle_min_context_pct = 20
llm_history_load_limit = 0

# ── Visible agent sessions (PTY) ─────────────────────────────────────────────
session_dir = "/tmp/seneschal_sessions"
visible_agent_enabled = false

# ── Agent delegation ──────────────────────────────────────────────────────────
agent_timeout_secs = 120
agent_mode = "cli"
agent_acp_command = "hermes acp"
agent_acp_warmup = false
agent_acp_keepalive_enabled = false
agent_acp_keepalive_interval_secs = 300
agent_acp_warmup_timeout_secs = 10
agent_acp_restart_backoff_secs = 2
agent_acp_restart_max_backoff_secs = 60

# ── Permissions (issue #167) ───────────────────────────────────────────────────
# Permission mode for backend agent `session/request_permission` requests.
# "ask" (default) — speak the question and let the user answer via the
# `respond_agent_permission` LLM tool.
# "full" — auto-approve every permission (trusted projects only).
permission_mode = "ask"

# ── Inference daemon ──────────────────────────────────────────────────────────
daemon_enabled = false
daemon_interval_secs = 300

# ── EYES ──────────────────────────────────────────────────────────────────────
eyes_interval_secs = 0

# ── Apple Calendar & Reminders ─────────────────────────────────────────────────
apple_events_enabled = true

# ── Shell tool ────────────────────────────────────────────────────────────────
shell_enabled = false
shell_timeout_secs = 30

# ── Web Search (native API providers) ─────────────────────────────────────────
# Brave public search (default, free, no API key).  Disable with BRAVE_PUBLIC_SEARCH=0.
brave_public_search_enabled = true
tavily_max_tokens = 512

# ── Web Search (SearXNG fallback) ─────────────────────────────────────────────
searxng_secret = ""
web_search_enabled = true

# ── Speaker verification ──────────────────────────────────────────────────────
# speaker_model defaults to None at runtime; the env override checks whether
# models/speaker_embedding.onnx exists when no value is configured.
speaker_enabled = true
speaker_enrollment_path = "data/pro/speaker.emb"
speaker_similarity_min = 0.45

# ── Conversation mode ─────────────────────────────────────────────────────────
wake_word = "seneschal"             # Comma-separated list of wake words (e.g. "seneschal,jardis"); first entry is the bot's name
ambient_clear_secs = 300
speaker_ambient_trigger = 3

# ── Ambient context buffer ────────────────────────────────────────────────────
speaker_max_profiles = 5
ambient_buffer_minutes = 3
ambient_buffer_max_entries = 30

# ── Self-managed LLM process ──────────────────────────────────────────────────
llm_self_managed = false

# ── Persistence ───────────────────────────────────────────────────────────────
db_path = "data/pro/seneschal.db"

# ── Hermes ACP session log viewer ─────────────────────────────────────────────
hermes_session_viewer = "off"

# ── Cold Path Memory (S-DREAM) ────────────────────────────────────────────────
s_dream_interval_secs = 3600
s_dream_on_idle = true
s_dream_idle_threshold_secs = 600
s_dream_scheduled_hour = 3
s_dream_l2_min_messages = 50
s_dream_jsonl_dir = "data/pro/archives"

# ── Remote device (WebSocket) ─────────────────────────────────────────────────
ws_port = 9090

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins = []
active_plugin = ""

