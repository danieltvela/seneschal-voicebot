[package]
name = "seneschal-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-agents = { path = "../seneschal-agents" }
seneschal-core = { path = "../seneschal-core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
