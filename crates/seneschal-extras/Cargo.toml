[package]
name = "seneschal-extras"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-core = { path = "../seneschal-core" }
seneschal-agents = { path = "../seneschal-agents" }
seneschal-plugins = { path = "../seneschal-plugins" }
seneschal-search = { path = "../seneschal-search" }
seneschal-mcp = { path = "../seneschal-mcp" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
tracing = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.8"
cpal = "0.17"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6"
