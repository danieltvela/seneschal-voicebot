[package]
name = "seneschal-plugins"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-agents = { path = "../seneschal-agents" }
seneschal-mcp = { path = "../seneschal-mcp" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
