[package]
name = "seneschal-remote"
version = "0.1.0"
edition = "2024"
[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-core = { path = "../seneschal-core" }
seneschal-control = { path = "../seneschal-control" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tracing = "0.1"
anyhow = "1"
futures-util = "0.3"
rubato = "0.15"
async-channel = "2"
