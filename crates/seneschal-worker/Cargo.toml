[package]
name = "seneschal-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-core = { path = "../seneschal-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde_json = "1"
dashmap = "6"
tracing = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27.0"
