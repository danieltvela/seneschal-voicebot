[package]
name = "seneschal-models"
version = "0.1.0"
edition = "2024"
description = "Central model registry, downloader and NeMo service status for the desktop model manager (issue #35)"

[dependencies]
anyhow = "1"
dirs = "5"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
wiremock = "0.6"
