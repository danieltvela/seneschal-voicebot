[package]
name = "asr"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-core = { path = "../seneschal-core" }

tokio = { version = "1", features = ["sync", "macros", "rt", "time", "net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
temp-env = "0.3"
hound = "3"
