[package]
name = "seneschal-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
dashmap = "6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures-util = "0.3"
portable-pty = "0.8"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
temp-env = "0.3"
tempfile = "3.27.0"
