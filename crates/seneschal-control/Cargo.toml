[package]
name = "seneschal-control"
version = "0.1.0"
edition = "2024"
[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-core = { path = "../seneschal-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
rubato = "0.15"
