[package]
name = "seneschal-tools-core"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
seneschal-core = { path = "../seneschal-core" }
seneschal-search = { path = "../seneschal-search" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
