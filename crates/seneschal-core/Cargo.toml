[package]
name = "seneschal-core"
version = "0.1.0"
edition = "2024"

[dependencies]
seneschal-common = { path = "../seneschal-common" }
tokio = { version = "1", features = ["full"] }
cpal = "0.17"
rubato = "0.15"
dotenvy = "0.15"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
async-trait = "0.1"
futures-util = "0.3"
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "=0.8.6", features = ["sqlite", "runtime-tokio-native-tls"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies.whisper-cpp-plus]
version = "0.1.4"
features = ["metal"]

[target.'cfg(not(target_os = "macos"))'.dependencies.whisper-cpp-plus]
version = "0.1.4"

[dependencies.kokorox]
version = "0.1"
optional = true

[dependencies.sherpa-rs]
version = "0.6.8"
optional = true

[dependencies.parakeet-rs]
version = "0.3.5"
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
speech = { version = "0.8", optional = true }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"], optional = true }
objc2-avf-audio = { version = "0.3.1", features = [
    "AVSpeechSynthesis",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTypes",
    "block2",
], optional = true }

[features]
kokoro = ["dep:kokorox"]
speaker = ["dep:sherpa-rs"]
parakeet = ["dep:parakeet-rs"]
speech = ["dep:speech"]
avspeech = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-avf-audio"]
# Feature flags used in #[cfg] attributes within the crate (propagated from root)
tui = []
control = []
remote = []

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27.0"
temp-env = "0.3"
